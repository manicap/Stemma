<a
  id="person-list-item-{{ person.pk }}"
  class="person-list-item{% if selected or selected_person.pk == person.pk %} is-selected{% endif %}"
  {% if selected or selected_person.pk == person.pk %}aria-current="page"{% endif %}
  {% if oob %}hx-swap-oob="outerHTML"{% endif %}
  href="{% url 'people:detail' person.pk %}"
  hx-get="{% url 'people:detail' person.pk %}"
  hx-target="#person-detail"
  hx-indicator="#detail-loading"
  hx-push-url="true"
>
  <span class="avatar" aria-hidden="true">{{ person.first_name|first|default:"·" }}{{ person.last_name|first }}</span>
  <span>
    <strong>{{ person.first_name }} {{ person.last_name }}</strong>
    <small>{{ person.category.name|default:"Bez kategorie" }}</small>
  </span>
</a>
