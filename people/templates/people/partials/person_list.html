<nav
  id="person-list"
  class="people-list"
  aria-label="Seznam osob"
  {% if oob %}hx-swap-oob="outerHTML"{% endif %}
>
  {% for presentation in person_presentations %}
    {% include "people/partials/person_list_item.html" with person=presentation.person person_facts=presentation.facts %}
  {% empty %}
    <p class="empty-state">Zatím zde nejsou žádné osoby, které můžete zobrazit.</p>
  {% endfor %}
</nav>
