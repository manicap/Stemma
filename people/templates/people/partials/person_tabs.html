<nav class="person-tabs" aria-label="Sekce detailu osoby">
  <a
    class="person-tab{% if active_person_tab == 'overview' or not active_person_tab %} is-active{% endif %}"
    href="{% url 'people:detail' selected_person.pk %}"
    hx-get="{% url 'people:detail' selected_person.pk %}"
    hx-target="#person-detail"
    hx-push-url="true"
    {% if active_person_tab == 'overview' or not active_person_tab %}aria-current="page"{% endif %}
  >Přehled</a>
  <a
    class="person-tab{% if active_person_tab == 'relationships' %} is-active{% endif %}"
    href="{% url 'people:relationships' selected_person.pk %}"
    hx-get="{% url 'people:relationships' selected_person.pk %}"
    hx-target="#person-detail"
    hx-push-url="true"
    {% if active_person_tab == 'relationships' %}aria-current="page"{% endif %}
  >Vztahy</a>
  <span class="person-tab is-disabled" aria-disabled="true">Události <small>Plánováno</small></span>
  <a
    class="person-tab{% if active_person_tab == 'residences' %} is-active{% endif %}"
    href="{% url 'people:residences' selected_person.pk %}"
    hx-get="{% url 'people:residences' selected_person.pk %}"
    hx-target="#person-detail"
    hx-push-url="true"
    {% if active_person_tab == 'residences' %}aria-current="page"{% endif %}
  >Bydliště</a>
  <a
    class="person-tab{% if active_person_tab == 'grave_sites' %} is-active{% endif %}"
    href="{% url 'people:grave-sites' selected_person.pk %}"
    hx-get="{% url 'people:grave-sites' selected_person.pk %}"
    hx-target="#person-detail"
    hx-push-url="true"
    {% if active_person_tab == 'grave_sites' %}aria-current="page"{% endif %}
  >Hrobová místa</a>
  <a
    class="person-tab{% if active_person_tab == 'health' %} is-active{% endif %}"
    href="{% url 'people:health' selected_person.pk %}"
    hx-get="{% url 'people:health' selected_person.pk %}"
    hx-target="#person-detail"
    hx-push-url="true"
    {% if active_person_tab == 'health' %}aria-current="page"{% endif %}
  >Zdraví</a>
  <span class="person-tab is-disabled" aria-disabled="true">Materiály <small>Plánováno</small></span>
</nav>
