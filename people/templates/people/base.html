{% load static %}
<!doctype html>
<html lang="cs" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stemma{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'people/stemma.css' %}">
  <script src="{% static 'people/htmx-2.0.10.min.js' %}"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'people:index' %}" aria-label="Stemma – hlavní stránka">
      <span aria-hidden="true">♧</span>
      <span>Stemma</span>
    </a>
    <div class="topbar-actions">
      {% block mobile_list_action %}
      <button class="list-toggle" type="button" data-person-list-open data-short-label="Seznam" aria-controls="people-panel" aria-expanded="false">
        Seznam osob
      </button>
      {% endblock %}
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Přepnout na tmavý motiv" aria-pressed="false">
        Tmavý motiv
      </button>
      {% if user.is_authenticated %}
        <span class="profile-summary" title="Přihlášený uživatel">{{ user.get_full_name|default:user.username }}</span>
        <form class="logout-form" method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button class="auth-action" type="submit" data-short-label="Odhlásit">Odhlásit se</button>
        </form>
      {% else %}
        <a class="auth-action" data-short-label="Přihlásit" href="{% url 'accounts:login' %}?next={{ login_return_path|default:request.get_full_path|urlencode }}">Přihlásit se</a>
      {% endif %}
    </div>
  </header>
  {% block content %}{% endblock %}
  <script src="{% static 'people/stemma.js' %}"></script>
</body>
</html>
