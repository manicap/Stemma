# Workflow „slice“: jeden malý řez, jeden agent, pak deterministické kontroly.
# Vzniklo z šablony Multipoolu (manicap/multipool, templates/cezar/slice.yaml).
name: slice
description: Jeden malý řez. Jeden agent se skillem stemma-context, pak testy, Django kontroly, velikost diffu a changelog; při chybě zpět agentovi.
steps:
  - id: setup
    name: Příprava prostředí
    command: |
      set -e
      # Cezar běží v Dockeru: Python 3.14 s venv je v image v /opt/stemma-python (systémový python3 je 3.11 bez ensurepip).
      PY=""
      for c in /opt/stemma-python/bin/python3.14 python3.14 python3; do
        p=$(command -v "$c" || true)
        if [ -n "$p" ] && "$p" -c 'import ensurepip' 2>/dev/null; then PY=$p; break; fi
      done
      echo "[setup] python: ${PY:-NENALEZEN}"; [ -n "$PY" ] || { echo "[setup] CHYBA: nenašel jsem python3 s modulem venv/ensurepip"; exit 1; }
      "$PY" --version
      if [ ! -x .venv/bin/pip ]; then
        echo "[setup] vytvářím .venv"
        rm -rf .venv; "$PY" -m venv .venv || { echo "[setup] CHYBA: venv nejde vytvořit (Debian/Ubuntu: sudo apt install python3.X-venv podle verze)"; exit 1; }
      fi
      echo "[setup] instaluji requirements.txt"
      .venv/bin/pip install --disable-pip-version-check -r requirements.txt || { echo "[setup] CHYBA: instalace závislostí selhala (výpis výše)"; exit 1; }
      [ -f config/settings_local.py ] || { echo "[setup] kopíruji settings_local.example.py"; cp config/settings_local.example.py config/settings_local.py; }
      echo "[setup] migrace"
      .venv/bin/python manage.py migrate --noinput
      echo "[setup] hotovo"

  - id: implement
    name: Implementace
    skill: stemma-context
    prompt: |
      {{task}}

      Pravidla projektu máš ve skillu stemma-context. Celý adresář docs/ nečti;
      otevři jen soubor a sekci, na kterou skill nebo úloha výslovně odkazuje.
      Python spouštěj přes .venv/bin/python (prostředí je připravené).
      Drž se jednoho řezu z úlohy. Když se kontrola nepovede, oprav jen to, co selhalo.

      Šetři kroky, každý další krok znovu posílá celý kontext:
      - Celou sadu testů ani prohlížečové skripty nespouštěj; po tobě je spustí workflow.
        Pusť nanejvýš jeden cílený test modulu, kterého se změna týká.
      - Velké soubory (stemma.css, stemma.js) nečti celé; hledej rg a čti jen potřebné řádky.
      - Když úloha jmenuje commity nebo soubory k převzetí, použij git (cherry-pick/checkout), nepřepisuj je ručně.

      Na konci přidej záznam do changelogu: nový soubor docs/changelog/RRRR-MM-DD-<krátký-název>.md
      podle šablony docs/changelog/_sablona.md. Piš česky a lidsky: co se změnilo z pohledu
      uživatele, proč, jak to vyzkoušet. Žádné výpisy kódu. Pak commitni s explicitními cestami.

  - id: django-checks
    name: Django kontroly
    command: |
      .venv/bin/python manage.py check &&
      .venv/bin/python manage.py makemigrations --check --dry-run
    onFail:
      retry: implement
      max: 2

  - id: tests
    name: Testy
    command: .venv/bin/python manage.py test
    onFail:
      retry: implement
      max: 2

  - id: diff-size
    name: Velikost diffu
    command: |
      lines=$(git diff --numstat "$CEZ_BASE" | awk '{s+=$1+$2} END {print s+0}')
      echo "změněných řádků: $lines (limit 600)"
      [ "$lines" -le 600 ]
    onFail:
      retry: implement
      max: 1

  - id: changelog
    name: Changelog
    command: |
      { git diff --name-only --diff-filter=A "$CEZ_BASE" -- 'docs/changelog/*.md'
        git ls-files --others --exclude-standard -- 'docs/changelog/*.md'; } | grep -v '_sablona.md' | grep -q . \
        || { echo "Chybí nový záznam v docs/changelog/ (viz docs/changelog/_sablona.md)."; exit 1; }
    onFail:
      retry: implement
      max: 1
